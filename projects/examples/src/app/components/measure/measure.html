<div class="row mt-4">
  <div class="col-12">
    <div [ntkMeasure]="onMeasure">
      @for (item of forLoop; track $index; let index = $index) {
        @if (index === forLoop.length - 1) {
          <p class="mt-2">Finished loading</p>
          <p>check the console for results (Loop size: {{ forLoop.length }})</p>
        }
      }
    </div>
  </div>
</div>
